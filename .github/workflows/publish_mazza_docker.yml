name: Publish Mazza Advocacia docker image

# Roda automaticamente a cada push na develop (ou manualmente pelo GitHub)
on:
  push:
    branches:
      - develop
    tags:
      - v*
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/noble-company/chatwoot_mazza

# Permissão para publicar no ghcr.io usando o GITHUB_TOKEN automático
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir tag da imagem
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "DOCKER_TAG=${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
