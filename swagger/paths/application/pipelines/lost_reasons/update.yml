operationId: update-a-pipeline-lost-reason
summary: Update a pipeline lost reason
description: Update an existing lost reason in the account (admin only)
security:
  - userApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/pipeline_lost_reason_create_update_payload'
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/pipeline_lost_reason'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: Pipeline lost reason not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
