tags:
  - Pipelines
operationId: get-details-of-a-pipeline-item
summary: Get a pipeline item
security:
  - userApiKey: []
description: Get the details of a single pipeline item (card)
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/pipeline_item'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: Pipeline item not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
