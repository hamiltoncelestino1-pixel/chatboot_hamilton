tags:
  - Pipelines
operationId: list-all-pipelines
summary: List all pipelines
security:
  - userApiKey: []
description: List all pipelines available in the current account
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: array
          description: 'Array of pipelines with their stages'
          items:
            $ref: '#/components/schemas/pipeline'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
