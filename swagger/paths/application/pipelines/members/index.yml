tags:
  - Pipelines
operationId: list-pipeline-members
summary: List Pipeline Members
description: Get all agents assigned to a pipeline
security:
  - userApiKey: []
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: array
          description: 'Array of all agents in the pipeline'
          items:
            $ref: '#/components/schemas/agent'
  '403':
    description: Access denied
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: Pipeline not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
