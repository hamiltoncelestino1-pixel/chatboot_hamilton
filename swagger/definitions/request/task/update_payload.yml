type: object
properties:
  title:
    type: string
    description: The title of the task
  due_date:
    type: string
    format: date-time
    description: When the task is due
  assignee_id:
    type: number
    description: The ID of the responsible agent
  recurrence_interval:
    type: string
    enum: [daily, weekly, monthly]
    description: >-
      If set, completing this task automatically creates the next occurrence with this same
      interval, due the corresponding period after this task's due_date
