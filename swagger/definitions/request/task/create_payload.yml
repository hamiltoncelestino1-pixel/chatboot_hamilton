type: object
properties:
  title:
    type: string
    description: The title of the task
  due_date:
    type: string
    format: date-time
    description: When the task is due
  contact_id:
    type: number
    description: The ID of the contact this task belongs to
  conversation_id:
    type: number
    description: The ID of an optional linked conversation
  pipeline_item_id:
    type: number
    description: The ID of an optional linked pipeline card
  assignee_id:
    type: number
    description: The ID of the responsible agent. Defaults to the current user if omitted
  recurrence_interval:
    type: string
    enum: [daily, weekly, monthly]
    description: >-
      If set, completing this task automatically creates the next occurrence with this same
      interval. The next due date stays on the schedule set by the first task in the chain -
      a monthly task due on the 31st keeps landing on the 31st, skipping shorter months - and
      occurrences already in the past are skipped, so completing a task late never produces a
      next occurrence that is itself already overdue. Editing a due date by hand re-bases the
      schedule on the new date
