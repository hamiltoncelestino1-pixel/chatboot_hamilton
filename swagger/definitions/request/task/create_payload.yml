type: object
properties:
  title:
    type: string
    description: The title of the task
  due_date:
    type: string
    format: date-time
    description: When the task is due
  contact_id:
    type: number
    description: The ID of the contact this task belongs to
  conversation_id:
    type: number
    description: The ID of an optional linked conversation
  pipeline_item_id:
    type: number
    description: The ID of an optional linked pipeline card
  assignee_id:
    type: number
    description: The ID of the responsible agent. Defaults to the current user if omitted
